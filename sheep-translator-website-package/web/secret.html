<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sheep Translator</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app" aria-live="polite">
      <a class="home-link" href="index.html#home" aria-label="Back home">←</a>

      <section class="screen compose-screen is-active" data-screen="compose">
        <h1>I WANT TO TELL YOU<br>...</h1>

        <button class="sheep-button compose-sheep-button" type="button" aria-label="Write a secret message">
          <img class="sheep sheep-one" src="assets/sheep1.png" alt="">
        </button>

        <form class="message-form" aria-label="Secret message form">
          <input class="message-input" type="text" autocomplete="off" aria-label="Secret message">
          <button class="submit-button" type="submit" aria-label="Submit message">
            <span aria-hidden="true">➤</span>
          </button>
        </form>
      </section>

      <section class="screen record-screen" data-screen="record">
        <h2 class="saved-label">Saved as baa~ <span aria-hidden="true">🐑</span></h2>

        <button class="sheep-button record-sheep-button" type="button" aria-label="Back to message">
          <img class="sheep sheep-two" src="assets/sheep2.png" alt="">
        </button>

        <button class="record-button" type="button" aria-label="Start recording">
          <span class="record-icon" aria-hidden="true"></span>
        </button>

        <div class="record-panel" aria-label="Record sheep call sequence">
          <div class="sequence-list" aria-label="Sheep call sequence"></div>
          <p class="save-status" aria-live="polite"></p>
        </div>
      </section>

      <section class="screen done-screen" data-screen="done">
        <img class="sheep done-sheep" src="assets/sheep2.png" alt="">

        <div class="done-copy">
          <p class="done-title">BAA SAVED!</p>
          <p class="done-summary" aria-live="polite"></p>
          <a class="done-home-button" href="index.html#home">HOME</a>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
